version: "3.9"

services:

  db:
    image: postgres:18.3
    container_name: crispdm_db
    restart: always
    environment:
      POSTGRES_DB: crispdm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: crispdm_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/crispdm
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db

  frontend:
    image: node:24.14.0
    container_name: crispdm_frontend
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

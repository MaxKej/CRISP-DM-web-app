services:

  db:
    image: postgres:18.6
    container_name: crispdm_db
    environment:
      POSTGRES_DB: crispdm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: crispdm_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/crispdm
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db

  frontend:
    image: node:26.8.2-slim
    container_name: crispdm_frontend
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
